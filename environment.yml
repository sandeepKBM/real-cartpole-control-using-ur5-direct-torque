# Conda environment for the real_Cartpole MuJoCo true-torque UR5e workflow
# (plus ROS 2 Jazzy / MoveIt for the hardware pipeline node).
# This environment is intentionally on Python 3.12 so RoboStack's `moveit_py`
# bindings are available alongside the rest of the Jazzy stack.
#
# Create (from repo root):
#   conda env create -f environment.yml
# Activate:
#   conda activate mujoco_ur5e
#
# Cluster note: container launchers may hardcode
#   /common/users/ss5772/miniforge3/bin/python3
# On a local machine, either activate mujoco_ur5e or set PYTHON_BIN to your env python.
#
# The archived CoppeliaSim/RL lane's deps (coppeliasim_zmqremoteapi_client)
# were removed at archive time — see archive/coppelia/README.md if
# resurrecting that lane. gymnasium/stable-baselines3/torch were reinstalled
# 2026-07-06 for rl_gain_scheduling/ (a new, architecturally distinct MuJoCo
# RL lane -- unrelated to the archived CoppeliaSim one). torch's default pip
# wheel bundles a CUDA runtime newer than this host's driver supports, so
# torch.cuda.is_available() is False here; training defaults to CPU, which
# is the right choice anyway for the small MLP policy this lane trains.
name: mujoco_ur5e
channels:
  - conda-forge
  - robostack-jazzy
dependencies:
  - python=3.12
  - pip
  - wheel
  - setuptools
  - cmake
  - make
  - ninja
  - pkg-config
  - colcon-common-extensions
  - ffmpeg
  - matplotlib
  - numpy
  - pillow
  - pyyaml
  - tqdm
  - ros-jazzy-desktop
  - ros-jazzy-moveit
  - ros-jazzy-moveit-py
  - ros-jazzy-ros2-control
  - ros-jazzy-ros2-controllers
  - pip:
      - mediapy
      - mujoco>=2.3.3
      - pin>=3.1            # Pinocchio rigid-body dynamics (model-based controller)
      - scipy>=1.11
      - ur_rtde             # real-UR5e RTDE bridge (hardware/ lane)
      - torch==2.12.1              # rl_gain_scheduling/ (CPU; see comment above)
      - gymnasium==1.3.0           # rl_gain_scheduling/
      - stable-baselines3==2.9.0   # rl_gain_scheduling/ (PPO)
      - tensorboard==2.21.0        # rl_gain_scheduling/ (SB3 training-curve logging)
      - optuna==4.1.0              # tools/ur5e_suggest_gains.py (real-hardware retune loop)
