# Conda environment for the real_Cartpole MuJoCo true-torque UR5e workflow
# (plus ROS 2 Jazzy / MoveIt for the hardware pipeline node).
# This environment is intentionally on Python 3.12 so RoboStack's `moveit_py`
# bindings are available alongside the rest of the Jazzy stack.
#
# Create (from repo root):
#   conda env create -f environment.yml
# Activate:
#   conda activate mujoco_ur5e
#
# Cluster note: container launchers may hardcode
#   /common/users/ss5772/miniforge3/bin/python3
# On a local machine, either activate mujoco_ur5e or set PYTHON_BIN to your env python.
#
# The archived CoppeliaSim/RL lane's deps (coppeliasim_zmqremoteapi_client,
# stable_baselines3, gymnasium) were removed at archive time — see
# archive/coppelia/README.md if resurrecting that lane.
name: mujoco_ur5e
channels:
  - conda-forge
  - robostack-jazzy
dependencies:
  - python=3.12
  - pip
  - wheel
  - setuptools
  - cmake
  - make
  - ninja
  - pkg-config
  - colcon-common-extensions
  - ffmpeg
  - matplotlib
  - numpy
  - pillow
  - pyyaml
  - tqdm
  - ros-jazzy-desktop
  - ros-jazzy-moveit
  - ros-jazzy-moveit-py
  - ros-jazzy-ros2-control
  - ros-jazzy-ros2-controllers
  - pip:
      - mediapy
      - mujoco>=2.3.3
      - pin>=3.1            # Pinocchio rigid-body dynamics (model-based controller)
      - scipy>=1.11
      - ur_rtde             # real-UR5e RTDE bridge (hardware/ lane)
