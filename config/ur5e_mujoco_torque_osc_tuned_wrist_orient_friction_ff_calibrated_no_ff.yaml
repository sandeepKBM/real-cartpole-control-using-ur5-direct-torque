# config/ur5e_mujoco_torque_osc_tuned_wrist_orient_friction_ff_calibrated.yaml with
# friction_feedforward: false (2026-08-02). Diagnostic A/B config, not a proposed
# default.
#
# Why this exists: real hardware today (direct_torque_20260802_205034/205057/205120,
# +X moves at the wrist2-offset pose) showed a real, consistent ~1.95-2.04Hz TCP-jerk
# oscillation the user asked to dig into (see the Haiku agent's report and the
# follow-up analysis this session). Computing the X-axis loop's own closed-loop
# natural frequency from kp_x=400/kd_x=40 and the REAL task-space X inertia
# (Lambda_xx, from MuJoCo's actual M(q)/J(q) at the traced q's -- not a guess,
# ~2.3kg and nearly pose-invariant at this pose) gives f_n = 2.0-2.1Hz, zeta~0.65 --
# matching the measured oscillation almost exactly and explaining why it's the same
# frequency regardless of displacement/duration (Lambda_xx only depends on pose).
# zeta~0.65 is underdamped but not wild -- something has to be feeding it
# continuously. qd_lift during 205057's move phase stayed small (max 0.081 rad/s)
# and spent 85% of move-phase cycles inside friction_ff_qd_deadband=0.05 rad/s --
# the same tanh(qd/deadband) transition zone already documented (2026-07-31) to
# cause a real closed-loop limit cycle at hold phase when the deadband was too
# tight. Hypothesis: the same switching nonlinearity is exciting the move-phase
# resonance here too.
#
# This config disables friction_feedforward entirely (leaving kp_x/kd_x/gains/
# every other flag untouched) as the cleanest single-variable A/B: run the exact
# same command as 205057 (dx=0.10, move_duration=6.0, wrist2-offset start pose)
# with this config. If the ~2Hz ringing collapses or shrinks, that confirms
# friction_feedforward's deadband nonlinearity as the exciter (fix = deadband/gain
# retune on that term, not on kp_x/kd_x). If it doesn't change, the resonance is
# being excited by something else (torque quantization, real stick-slip) and the
# next step looks elsewhere. NOT yet real-hardware tested -- this is the first
# command to carry it. Expect WORSE friction tracking than the calibrated config
# while this flag is off (that's expected and not the thing being measured here).
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
    kp_rot_wrist: 0.0
    kd_rot_wrist: 10.0
  wrist_orientation_task: true
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  friction_feedforward: false
  friction_ff_qd_deadband: 0.05
  friction_ff_coulomb_nm:
    shoulder_pan_joint: 5.0
    shoulder_lift_joint: 6.1
    elbow_joint: 5.0
    wrist_1_joint: 1.0
    wrist_2_joint: 1.0
    wrist_3_joint: 1.0
  friction_ff_viscous:
    shoulder_pan_joint: 0.4
    shoulder_lift_joint: 0.4
    elbow_joint: 0.4
    wrist_1_joint: 0.15
    wrist_2_joint: 0.15
    wrist_3_joint: 0.15
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
