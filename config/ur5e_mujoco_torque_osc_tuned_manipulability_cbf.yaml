# Demonstration config for the manipulability CBF (2026-08-13). NOT a tuned or
# validated transport config -- config/ur5e_mujoco_torque_osc_tuned.yaml remains the
# default and is unmodified. This file is the identical tuned config with ONLY the
# manipulability_cbf block appended, so any behavior difference is attributable to
# that flag alone.
#
# What the flag does, in one line: adds an OSCBF-style (arXiv:2503.06736 Sec V-B1)
# control-barrier-function row to a per-cycle QP on the final commanded torque,
# requiring the Yoshikawa manipulability mu(q) = prod_i sigma_i(J(q)) to stay above
# manipulability_cbf_epsilon. Full derivation:
# controller_core/manipulability_cbf.py; full flag docstring:
# CartesianImpedanceConfig.manipulability_cbf. Status/evidence:
# docs/status/manipulability_cbf_2026-08-13.md.
#
# Measured closed-loop effect vs. this file's own baseline (assets/ur5e_torque/scene.xml,
# mujoco_qfrc gravity, no Coriolis feedforward, 2.0 s move + 1.0 s hold):
#   HEIGHT_ALPHA_0_5_Q with wrist_2 = 0.10 rad, world-Y transport dx = -0.10 m
#     baseline : wrist_2 0.100 -> 0.0057 rad, min mu 1.69e-4, max cond(J) 8.9e2
#     with CBF : wrist_2 floor 0.0930 rad,    min mu 1.84e-3, max cond(J) 5.3e1
#   HEIGHT_ALPHA_0_5_WRIST2_OFFSET_Q, world-X transport dx = +0.15 m
#     baseline : min mu 1.77e-6, max cond(J) 5.6e4
#     with CBF : min mu 6.77e-4, max cond(J) 2.5e2
#   Same pose, dx = +0.05 m / -0.10 m / -0.15 m: byte-identical to baseline (0 active
#   cycles) -- the filter is an exact no-op where nothing is approached.
#
# NOT validated: any real hardware; this repo's 4-category rigor sweep; any interaction
# with split_base_wrist_task / reduced_task_dims beyond "it runs and mu is read from the
# full Jacobian". epsilon = 1.0e-3 is sized for the height_alpha_0_5 pose family only
# (mu ~ 0.019 * |wrist_2| there) and is NOT a universal constant.
#
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  # Canonical active-origin transport pose for residual-torque transport tuning.
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

  # --- manipulability CBF (the only difference from the tuned default) ---
  manipulability_cbf: true
  manipulability_cbf_epsilon: 1.0e-3
  manipulability_cbf_alpha1: 10.0
  manipulability_cbf_alpha2: 10.0
  manipulability_cbf_fd_step: 1.0e-5
  manipulability_cbf_curvature_step: 1.0e-4

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
