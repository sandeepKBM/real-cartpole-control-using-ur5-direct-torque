# SAC variant of
# config/rl_gain_scheduling_alpha05_bidirectional_adaptive_lambda_residual_penalized_safety_fix.yaml
# (preserved unmodified). This is the SAC/residual_torque half of a planned
# pair of parallel 2026-07-29 SAC experiments testing whether the algorithm
# (not the architecture) was the limiting factor in the four prior real PPO
# attempts at the height_alpha=0.5 directional-asymmetry fix (AGENTS.md
# sec 3; full PPO history in
# docs/status/rl_gain_scheduling_alpha05_directional_fix_2026-07-29.md).
#
# Every mujoco/controller/env/reward field below is an EXACT copy of the
# source config -- same env.action_mode "residual_torque", same
# env.residual_torque.fixed_gains/max_nm ([3.0, 3.0, 3.0, 1.5, 1.5, 1.5] Nm),
# same reward.residual_magnitude_weight penalty (0.05), same corrected
# controller.safety.max_orientation_error_rad (0.25), same
# height_alpha_range [0.5, 0.5] / target_x_delta_range_m [-0.20, 0.20]. Only
# the `training:` block differs: PPO's on-policy hyperparameters
# (n_steps/n_epochs/gae_lambda/clip_range/ent_coef) are replaced with
# training.sac.* (field names/shapes taken from config/rl_gain_scheduling_
# sac.yaml's own template, itself unexercised beyond a 2-step smoke test --
# this is the first real SAC training attempt in this project).
#
# total_timesteps/n_envs below are PLACEHOLDERS pending the required pilot
# run (50k-100k steps) -- same caveat rl_gain_scheduling_sac.yaml's own
# header states: SAC's sample efficiency per env-step differs enough from
# PPO's that the 3M-step budget should not be assumed to transfer without
# checking. n_envs=24 follows the memory-safe value validated on ilab4
# earlier today (~19GB steady RSS for a comparable PPO n_envs=24 probe,
# outputs/rl_gain_scheduling/memprobe16/); this run was launched sharing
# ilab4 with a second, independent SAC experiment (gains-mode,
# config/rl_gain_scheduling_sac_gains_alpha05.yaml, --run-name
# sac_gains_alpha05) -- real system state (uptime/free/cgroup cap) was
# checked immediately before launch rather than assuming full headroom.

mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  gravity_source: "pinocchio"
  coriolis_feedforward: true

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  nullspace_posture: true
  lambda_regularization: 0.1
  posture_reanchor_on_settle: true
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  # The flags that make the documented directional-asymmetry bug actually
  # reproduce -- copied from config/ur5e_mujoco_torque_osc_tuned_adaptive_lambda.yaml,
  # same as the source PPO safety-fix config.
  lambda_diagonal_shaping: true
  lambda_adaptive_regularization: true
  lambda_regularization_far: 1.0e-4
  lambda_cond_low: 1.0e4
  lambda_cond_high: 1.0e8
  jacobian_singular_cond_max: 1.0e18
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    # Matches ur5e_mujoco_torque_osc_tuned_adaptive_lambda.yaml (0.25), not
    # the stray 0.35 in the un-scoped default config/rl_gain_scheduling.yaml
    # -- see the source PPO config's own header for the full mismatch
    # writeup this value fixes.
    max_orientation_error_rad: 0.25

env:
  control_decimation_steps: 1
  height_alpha_range: [0.5, 0.5]
  target_x_delta_range_m: [-0.20, 0.20]
  move_duration_s: 1.0
  hold_duration_s: 2.0
  max_episode_seconds: 3.0
  record_lightweight_trace: true
  full_trace_logging: false
  gain_bounds:
    kp_x: [0.0, 800.0]
    kd_x: [0.0, 80.0]
    kp_y: [0.0, 160.0]
    kd_y: [0.0, 30.0]
    kp_z: [0.0, 240.0]
    kd_z: [0.0, 40.0]
    kp_rot: [0.0, 30.0]
    kd_rot: [0.0, 40.0]
    kp_posture: [0.0, 100.0]
    kd_posture: [0.0, 24.0]
    kd_joint: [0.0, 16.0]
  action_mode: "residual_torque"
  residual_torque:
    fixed_gains:
      kp_x: 400.0
      kd_x: 40.0
      kp_y: 80.0
      kd_y: 15.0
      kp_z: 120.0
      kd_z: 20.0
      kp_rot: 0.0
      kd_rot: 10.0
      kp_posture: 25.0
      kd_posture: 6.0
      kd_joint: 4.0
    max_nm: [3.0, 3.0, 3.0, 1.5, 1.5, 1.5]

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  gain_smooth_weight: 0.01
  torque_smooth_weight: 0.001
  terminal_safety_penalty: -25.0
  terminal_quality_weight: 50.0
  progress_weight: 50.0
  move_phase_disturbance_scale: 0.3
  residual_magnitude_weight: 0.05

training:
  policy: "MlpPolicy"
  net_arch: [128, 128]
  # PPO-only keys (n_steps, n_epochs, gae_lambda, clip_range) and PPO's own
  # top-level ent_coef are never read under --algo sac -- all SAC
  # hyperparameters live under training.sac below (train_ppo_gain_scheduler.py
  # _build_sac_kwargs).
  device: "cpu"
  seed: 0
  n_envs: 24
  total_timesteps: 3000000
  sac:
    learning_rate: 3.0e-4
    buffer_size: 200000
    learning_starts: 5000
    batch_size: 256
    # SB3 names this 'tau' -- renamed here to never read as joint torque
    # anywhere in this codebase; mapped explicitly at the SAC(...) call site.
    polyak_tau: 0.005
    gamma: 0.99
    train_freq: 1
    gradient_steps: 1
    action_noise: null
    ent_coef: "auto"
    target_update_interval: 1
    target_entropy: "auto"
