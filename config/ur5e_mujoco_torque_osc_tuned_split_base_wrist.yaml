# config/ur5e_mujoco_torque_osc_tuned_wrist_orient_friction_ff.yaml (the current best
# real-hardware config) with `split_base_wrist_task: true` additionally added.
#
# Why this exists (added 2026-08-01, docs/status/split_base_wrist_impedance_2026-08-01.md):
# real hardware the same night repeatedly tripped the TCP-acceleration safety guard using
# accel_duration_scurve at a modest target_accel (0.005-0.02 m/s^2) at the height_alpha=0.5
# transport pose, running config/ur5e_mujoco_torque_osc_tuned_wrist_orient_friction_ff.yaml.
# Root cause traced directly from real trace.jsonl: the arm sits almost exactly at
# wrist_2=0 (a UR5e kinematic singularity present at every height_alpha,
# hardware/poses.py::q_for_height_alpha), and the full 6x6 Jacobian's cond() -- used
# unconditionally for singular_scale/adaptive-eps scheduling and, when
# task_space_inertia_shaping is on, to build the Lambda that shapes the task wrench --
# oscillates 5-10x cycle-to-cycle purely from being parked there. Adding
# lambda_diagonal_shaping/lambda_adaptive_regularization on top of that config did NOT
# help on a real-hardware retest (if anything slightly worse, peak accel 0.92 vs
# 0.72 m/s^2): neither flag touches cond(J) itself, an upstream geometric property of J
# at that exact configuration that no downstream Lambda regularization fixes.
#
# Step-1 numeric evidence at the exact failure pose (q = [0.0, -0.835398, -1.2,
# -0.985398, 0.0, 0.0] = hardware/poses.py::HEIGHT_ALPHA_0_5_Q):
#   cond(full 6x6 J)                                            ~= 7.28e16 (numerically singular)
#   cond(3x3 position-rows x base-cols [pan, lift, elbow])      ~= 7.8    (well conditioned)
#   cond(3x3 rotation-rows x wrist-cols [w1, w2, w3])           == inf   (exactly rank-deficient)
# This REFUTES a naive symmetric base-translation/wrist-orientation split: the wrist-only
# rotation sub-Jacobian is exactly as singular as the shared pipeline it would replace, not
# better (wrist_1/wrist_3 axes align when wrist_2=0 -- the textbook UR wrist gimbal lock).
#
# Design driven by that evidence (controller_core/x_axis_cartesian_impedance.py,
# `split_base_wrist_task`, see its docstring for the full derivation): the translation task
# (Fx, Fy, Fz) is mapped through a reduced Jacobian that zeroes the wrist columns, so
# translation-task torque can never route through wrist_2 (or any wrist joint) regardless of
# how ill-conditioned the full J is there. The rotational wrench is dropped from this
# pipeline entirely (kept only in the diagnostic `wrench` trace field) rather than routed
# through the singular wrist-only submatrix. Orientation stays held by the already-validated
# nullspace_posture mechanism, but its projector is recomputed against the same reduced task
# Jacobian, plus the existing wrist_orientation_task joint-space PD path (no matrix inversion,
# so it cannot itself blow up from ill-conditioning) -- both already enabled in the base
# config this file builds on, unchanged here.
#
# Everything else in this file is byte-identical to
# config/ur5e_mujoco_torque_osc_tuned_wrist_orient_friction_ff.yaml -- only
# `split_base_wrist_task: true` is added. Sim-only; not yet real-hardware validated (see the
# status doc for validation results and caveats).
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
    kp_rot_wrist: 0.0
    kd_rot_wrist: 10.0
  wrist_orientation_task: true
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  split_base_wrist_task: true
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  friction_feedforward: true
  friction_ff_qd_deadband: 0.05
  friction_ff_coulomb_nm:
    shoulder_pan_joint: 5.0
    shoulder_lift_joint: 5.0
    elbow_joint: 5.0
    wrist_1_joint: 1.0
    wrist_2_joint: 1.0
    wrist_3_joint: 1.0
  friction_ff_viscous:
    shoulder_pan_joint: 0.4
    shoulder_lift_joint: 0.4
    elbow_joint: 0.4
    wrist_1_joint: 0.15
    wrist_2_joint: 0.15
    wrist_3_joint: 0.15
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
