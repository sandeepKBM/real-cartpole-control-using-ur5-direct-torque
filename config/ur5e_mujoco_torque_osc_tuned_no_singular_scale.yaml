# Variant of config/ur5e_mujoco_torque_osc_tuned.yaml (preserved unmodified) with
# jacobian_singular_cond_max raised from the class default (1.0e5) to 1.0e18, which
# disables the global cond(J)-based singular_scale term in
# controller_core/x_axis_cartesian_impedance.py for any physically realizable Jacobian
# (double-precision condition numbers don't reach 1e18 in practice).
#
# Why: singular_scale is a GLOBAL scalar (jacobian_singular_cond_max / cond(J)) that
# multiplies the ENTIRE 6-DOF wrench whenever cond(J) exceeds the threshold -- including
# well-conditioned axes. The transport start pose [0,-pi/2,0,-pi/2,0,0] is an exact wrist
# singularity (measured cond(J)=2.49e17), so with the old 1e5 threshold, singular_scale
# collapses to ~4e-13 and nulls essentially all task authority, including the X-translation
# direction (a well-conditioned singular value, sigma=2.16 at this pose). Measured effect:
# the end-effector does not move in X at all for the first ~0.2s of every move (tau~1e-11
# Nm), only escaping once wrist_2 drifts off exactly zero from gravity-comp/integration
# numerical residuals and cond(J) finally drops below 1e5 -- i.e. the controller relied on
# floating-point noise to break a marginal equilibrium. Fragile and non-physical.
#
# This term is also redundant with, and actively defeats, task_space_inertia_shaping's
# eps-regularized Lambda (lambda_regularization: 0.1, already in the base tuned config),
# which alone already produces a finite, healthy X force at this pose (measured
# Lambda[0,0]=2.54) -- singular_scale then throws that away.
#
# 2026-07-25 validation (see docs/CURRENT_STATUS.md for the full sweep and results):
# canonical grid, long holds, large displacements, and torque-scale robustness all
# re-validated with 0 regressions vs. the base tuned config, and the achievable move
# duration for a 0.15m move dropped from the base config's practical floor down toward
# ~0.25s (vs. ~1.0s-1.3s), WITH lower peak joint velocity and torque along the way at
# every duration tested -- not just faster, safer too. The hard ceiling past that point is
# the 3.0 rad/s joint-velocity guard (elbow), a real physical limit close to the UR5e's own
# manufacturer joint-speed rating, not a tuning artifact.
#
# Base tuned config's gain-override string for tools/ur5e_move_hold_transport.py (BASELINE_GAINS
# still overrides config gains for that driver -- same override, unrelated to this change):
#   --gain-overrides-json '{"kp_x": 400.0, "kd_x": 40.0, "kp_rot": 0.0, "kd_rot": 10.0, "kp_posture": 25.0, "kd_posture": 6.0, "kd_joint": 4.0}'
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
