# Evaluation-only copy of config/ur5e_mujoco_torque_osc_tuned_wrist_orient_friction_ff.yaml
# with mujoco.trajectory_profile explicitly set to "min_jerk" (added
# 2026-08-01, docs/status/qp_vs_impedance_wrist_singularity_2026-08-01.md).
#
# Why this exists: tools/compare_ur5e_mujoco_controllers.py's
# --target-x-deltas/--durations sweep has NO CLI passthrough for
# --trajectory-profile/--target-accel (confirmed by reading the tool's
# source: it only forwards --scene/--start-q-rad/--no-plot/--seed to the
# per-point ur5e_mujoco_torque_experiments.py child call). Without an
# explicit mujoco.trajectory_profile in the config,
# _choose_trajectory_profile() falls back to "step" for controller-rollout
# mode -- an instantaneous jump to the full target displacement. Using the
# base config/ur5e_mujoco_torque_osc_tuned_wrist_orient_friction_ff.yaml
# unmodified with the compare tool therefore drives BOTH controllers with a
# step input, which trips |Z-Z0| > 0.03 m almost immediately for both
# torque_qp and impedance regardless of pose (singular or not) -- a shared
# step-input shock artifact, not evidence about how each controller handles
# cond(J) near the wrist singularity specifically. This config swaps only
# the trajectory profile (mujoco.trajectory_profile: "min_jerk", a smooth
# full-duration profile already supported by the "legacy" branch of
# _choose_trajectory_profile -- not the accel_duration_scurve profile real
# hardware actually used, which is not reachable through the compare tool at
# all; that gap is used directly via
# tools/ur5e_mujoco_torque_experiments.py --trajectory-profile
# accel_duration_scurve instead, see the status doc) so the compare-tool
# sweep is at least a fair, non-shock apples-to-apples test between the two
# controllers. All controller gains/flags are otherwise byte-identical to
# the base config this was copied from -- do not use this file for anything
# other than that one comparison; it exists purely to work around the
# compare tool's missing CLI flag, not as a new tuned default.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  trajectory_profile: "min_jerk"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
    kp_rot_wrist: 0.0
    kd_rot_wrist: 10.0
  wrist_orientation_task: true
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  friction_feedforward: true
  friction_ff_qd_deadband: 0.05
  friction_ff_coulomb_nm:
    shoulder_pan_joint: 5.0
    shoulder_lift_joint: 5.0
    elbow_joint: 5.0
    wrist_1_joint: 1.0
    wrist_2_joint: 1.0
    wrist_3_joint: 1.0
  friction_ff_viscous:
    shoulder_pan_joint: 0.4
    shoulder_lift_joint: 0.4
    elbow_joint: 0.4
    wrist_1_joint: 0.15
    wrist_2_joint: 0.15
    wrist_3_joint: 0.15
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
