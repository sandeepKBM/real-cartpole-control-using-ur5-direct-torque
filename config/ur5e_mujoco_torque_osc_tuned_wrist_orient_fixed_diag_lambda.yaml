# Phase-2 beam-search candidate (docs/status/nullspace_envelope_search_2026-08-01.md).
# config/ur5e_mujoco_torque_osc_tuned_wrist_orient_fixed.yaml + lambda_diagonal_shaping: true.
#
# Why: Phase 1 of the same task found wrist_orientation_task fully fixes the "directional
# ceiling" failure (AGENTS.md sec 3) but has ZERO measurable effect on the separate -45 degree
# base-rotation Y-drift failure (0/38 in both baseline and wrist_orient_fixed at that pose,
# byte-identical guard-trip magnitudes). The Y-drift guard is a Y-axis TASK-SPACE failure
# (Fy = kp_y*y_err - kd_y*vy, not nullspace-projected), so an orientation-focused fix was never
# expected to touch it -- this candidate targets the wrench-shaping pipeline instead.
# lambda_diagonal_shaping removes a documented Lambda off-diagonal leak (originally found as an
# X->Z leak at the un-rotated pose's near-singularity region); a rotated base plausibly
# reintroduces the analogous leak as an X->Y term instead. Real hardware tried this flag live,
# once, with no sim validation and reported zero effect -- this is the first controlled sim test
# of it, combined with wrist_orient_fixed, specifically at the -45 pose failure.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
    kp_rot_wrist: 0.0
    kd_rot_wrist: 10.0
  wrist_orientation_task: true
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  lambda_diagonal_shaping: true
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
