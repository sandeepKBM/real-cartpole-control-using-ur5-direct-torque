# Named variant of config/ur5e_mujoco_torque_osc_tuned.yaml (the task's specified
# base config, unmodified -- see this repo's own "preserve old configs" rule) with
# exactly one addition: controller.second_task_axis_enabled: true.
#
# Why this file exists: the pendulum cartpole pipeline (tools/diagnostics/
# pendulum_toolY_*.py) pumps along TOOL Y, a genuine 3D world diagonal at
# ARM_Q0, via a rotated-frame state wrapper (see
# tools/diagnostics/pendulum_toolY_common.py's module docstring). That wrapper
# needs the controller's "y-role" axis (the OTHER in-plane tool direction,
# tool X) to track a LIVE, per-cycle target instead of the frozen
# reset-time value every other config relies on -- both (a) to correctly hold
# position against a LIVE-recomputed tool frame (the frozen-frame
# approximation was measured to drift ~12 deg over a guard-clean 0.22 m move,
# see docs/status/... 2-axis exploration) and (b) to test combined tool-X +
# tool-Y (parametric) pumping, which needs tool X to be an ACTIVELY DRIVEN
# axis, not just held.
#
# second_task_axis_enabled is default-off and, per controller.py's own
# implementation, byte-identical to the base config when unset -- this file
# changes NOTHING else. See controller_core/x_axis_cartesian_impedance/
# config.py's field docstring for the exact contract and mutual-exclusion
# guards (y_coupling_feedforward / y_control_mode=corridor / y_integral_action
# all raise if combined with this flag).
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  second_task_axis_enabled: true
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
