# Wrist-orientation-task variant of config/ur5e_mujoco_torque_osc_tuned.yaml.
# NEVER edit ur5e_mujoco_torque_osc_tuned.yaml itself -- this is a new, additive
# named config per this project's "preserve old configs" rule.
#
# Adds controller.wrist_orientation_task (default off elsewhere): a SEPARATE
# joint-space PD torque term, computed like tau_posture, that gives orientation
# its own dedicated authority via the wrist joints only:
#
#   tau_orient_wrist = J_rot.T @ (kp_rot_wrist * e_rot - kd_rot_wrist * omega) * WRIST_ORIENTATION_MASK
#
# This is deliberately NOT the shared Lambda-weighted wrench pipeline that
# kp_rot lives in -- that pipeline's kp_rot was found unstable near the
# wrist_2=0 transport singularity (AGENTS.md sec 3, config/
# ur5e_mujoco_torque_osc_tuned.yaml's own comment above: kp_rot=30 trips a
# guard at ~3.5s, kp_rot=5 at ~27s, kp_rot=0 never). kp_rot/kd_rot stay at
# 0.0/10.0 here, unchanged from the tuned baseline.
#
# Target bug (AGENTS.md sec 3, "The ceiling is directional, not just a
# magnitude limit", 2026-07-27/28): at height_alpha=0.5, +0.20m passes
# (worst orientation 0.214 rad) but -0.20m fails via orientation error
# (~0.250 rad) at half the peak wrist_2 excursion of the passing direction --
# root-caused to the nullspace-posture projector's restoring authority being
# asymmetric with wrist_2 sign at this pose, not a tunable-gain problem with
# the existing architecture. See docs/status/wrist_orientation_task_2026-07-29.md
# for validation numbers (before/after orientation error, full regression
# against the already-validated envelope).
#
# kp_rot_wrist/kd_rot_wrist chosen by direct empirical sweep against the
# documented -0.20m/+0.20m height_alpha=0.5 case (kp_rot_wrist in
# {10, 20, 40, 60}); see the status doc for the sweep table. No EXISTING gain
# (kp_x, kp_posture, kd_joint, lambda_regularization, ...) is changed from
# the tuned baseline -- this is a pure additive change.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  # Canonical active-origin transport pose for residual-torque transport tuning.
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
    kp_rot_wrist: 20.0
    kd_rot_wrist: 5.0
  wrist_orientation_task: true
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
