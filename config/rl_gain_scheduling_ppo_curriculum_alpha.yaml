# PPO counterpart of config/rl_gain_scheduling_sac_curriculum_alpha.yaml --
# identical env/controller/reward/curriculum blocks (byte-for-byte copied),
# training block swapped for the standard PPO hyperparameters used by all
# four prior PPO gains/residual-torque attempts (n_envs=57, n_steps=1024,
# n_epochs=10, gae_lambda=0.95, clip_range=0.2, ent_coef=0.01 -- copied from
# config/rl_gain_scheduling_alpha05_bidirectional_adaptive_lambda_residual_
# penalized_safety_fix.yaml's training block, preserved unmodified there).
#
# Added after the SAC curriculum run because the very first PPO gains-mode
# attempt (config/rl_gain_scheduling_alpha05_bidirectional.yaml, implicit
# action_mode="gains") was the WORST of all eight prior attempts (0/8),
# worse than SAC gains-mode's 2/8 -- so whether curriculum learning closes
# that PPO gap (or doesn't) is a real, separate data point about whether
# curriculum fixes something algorithm-specific (PPO's on-policy,
# higher-variance gradient estimate reacting worse to a hard/non-stationary
# distribution) or something about the task/distribution itself (in which
# case both algorithms should move together). A single YAML cannot hold
# both training.n_envs values at once (PPO historically used 57 on-policy
# workers, SAC 24 off-policy ones -- both independently validated
# memory-safe on 2026-07-29, not arbitrary), which is why this is a second
# file rather than a single combined training.ppo.*/training.sac.* block --
# train_ppo_gain_scheduler.py's --algo flag already fully separates which
# training.* keys get read (top-level PPO-only keys vs the nested
# training.sac block), so the two configs stay independently comparable to
# their respective algorithm's prior single-pose/multi-pose attempts.
#
# See docs/status/rl_curriculum_alpha_max_displacement_2026-07-29.md for the
# pilot outcome, full run results, and the PPO-vs-SAC curriculum comparison.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  gravity_source: "pinocchio"
  coriolis_feedforward: true

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  nullspace_posture: true
  lambda_regularization: 0.1
  posture_reanchor_on_settle: true
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  lambda_diagonal_shaping: true
  lambda_adaptive_regularization: true
  lambda_regularization_far: 1.0e-4
  lambda_cond_low: 1.0e4
  lambda_cond_high: 1.0e8
  jacobian_singular_cond_max: 1.0e18
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

env:
  control_decimation_steps: 1
  height_alpha_range: [0.05, 0.15]
  target_x_delta_range_m: [-0.24, 0.24]
  move_duration_s: 1.0
  hold_duration_s: 2.0
  max_episode_seconds: 3.0
  record_lightweight_trace: true
  full_trace_logging: false
  gain_bounds:
    kp_x: [0.0, 800.0]
    kd_x: [0.0, 80.0]
    kp_y: [0.0, 160.0]
    kd_y: [0.0, 30.0]
    kp_z: [0.0, 240.0]
    kd_z: [0.0, 40.0]
    kp_rot: [0.0, 30.0]
    kd_rot: [0.0, 40.0]
    kp_posture: [0.0, 100.0]
    kd_posture: [0.0, 24.0]
    kd_joint: [0.0, 16.0]
  action_mode: "gains"
  curriculum:
    enabled: true
    stages:
      - alpha_range: [0.05, 0.15]
        timestep_frac: 0.20
      - alpha_range: [0.10, 0.25]
        timestep_frac: 0.20
      - alpha_range: [0.15, 0.35]
        timestep_frac: 0.20
      - alpha_range: [0.25, 0.45]
        timestep_frac: 0.20
      - alpha_range: [0.35, 0.50]
        timestep_frac: 0.20

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  gain_smooth_weight: 0.01
  torque_smooth_weight: 0.001
  terminal_safety_penalty: -25.0
  terminal_quality_weight: 50.0
  progress_weight: 50.0
  move_phase_disturbance_scale: 0.3

training:
  policy: "MlpPolicy"
  net_arch: [128, 128]
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  # Matches all four prior PPO attempts' n_envs (validated memory-safe
  # 2026-07-29, see config/rl_gain_scheduling_alpha05_bidirectional_
  # adaptive_lambda_residual_penalized_safety_fix.yaml's own comment) --
  # deliberately NOT SAC's n_envs=24, since PPO is on-policy and its
  # original attempts' resource profile was validated at 57.
  n_envs: 57
  device: "cpu"
  seed: 0
  total_timesteps: 3000000
