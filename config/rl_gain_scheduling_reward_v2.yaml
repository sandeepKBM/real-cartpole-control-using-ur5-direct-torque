# Config for the RL gain-scheduling environment (rl_gain_scheduling/).
# Never touches config/ur5e_mujoco_torque_osc_tuned.yaml -- this is a new,
# separate lane. Structural controller settings (P3 flags, torque limits)
# mirror the tuned config; the `gains:` block here is only a construction-time
# seed, overwritten every step by the policy via set_gains().
#
# Reward-rebalance variant of config/rl_gain_scheduling.yaml (preserved
# unmodified -- see that file's own history). The first full training run
# (200k + 2,000,000 resumed steps) converged to a degenerate "hold position,
# never move" policy: 0/20 valid on the full comparative eval grid, with
# kp_x collapsing to exactly 0.0 (the gain-bounds lower edge) by the middle
# of training. Root cause: alive_bonus=0.5 accumulated every step for up to
# 1500 steps/episode (max 750) vastly outweighed terminal_quality_weight=50
# (a one-time bonus, max 50) -- surviving the episode by doing nothing was
# worth up to 15x more reward than the best possible transport quality
# bonus, and any risky move attempt that trips a safety guard forfeits ALL
# remaining alive-bonus steps (a much bigger loss than the fixed -25
# terminal_safety_penalty), making "never attempt the task" a dominant,
# low-variance strategy under the old weights.
#
# Fix: alive_bonus cut 0.5 -> 0.02 (25x; max per-episode accumulation drops
# from 750 to 30, now comparable to or less than terminal_quality_weight),
# terminal_quality_weight raised 50 -> 200 (successfully completing the task
# now dominates over merely surviving it). Everything else unchanged from
# the original config, to isolate this one change.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  gravity_source: "pinocchio"
  coriolis_feedforward: true

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  # Construction-time seed only -- overwritten every step by the policy.
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  nullspace_posture: true
  lambda_regularization: 0.1
  posture_reanchor_on_settle: true
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.35

env:
  # One env.step() == one mj_step() at the model's native rate (500Hz,
  # dt=0.002s) -- explicit, not a silent default. See AGENTS.md's
  # never-silently-change-control-rate rule.
  control_decimation_steps: 1
  # alpha=0 -> active_origin pose (ee z=1.08m), alpha=1 -> lower_b pose
  # (ee z=0.54m). Both share the wrist_2=0 singularity. No extrapolation
  # by default.
  height_alpha_range: [0.0, 1.0]
  target_x_delta_range_m: [-0.20, 0.20]
  move_duration_s: 1.0
  hold_duration_s: 2.0
  max_episode_seconds: 3.0
  record_lightweight_trace: true
  full_trace_logging: false
  # Rescale table for the policy's [-1, 1] action -> physical gain. All
  # lower bounds 0 (PD/damping gains must stay non-negative for a stable
  # law). Upper bounds seeded from config/ur5e_mujoco_torque_osc_tuned.yaml's
  # validated values with headroom. kp_rot capped at 30, not higher: this
  # session found the task rotation PD is unstable at the wrist singularity
  # regardless of magnitude, only slower to diverge as kp_rot shrinks
  # (kp_rot=30 trips the safety guard at ~3.5s hold; see AGENTS.md sec 3).
  gain_bounds:
    kp_x: [0.0, 800.0]
    kd_x: [0.0, 80.0]
    kp_y: [0.0, 160.0]
    kd_y: [0.0, 30.0]
    kp_z: [0.0, 240.0]
    kd_z: [0.0, 40.0]
    kp_rot: [0.0, 30.0]
    kd_rot: [0.0, 40.0]
    kp_posture: [0.0, 100.0]
    kd_posture: [0.0, 24.0]
    kd_joint: [0.0, 16.0]

reward:
  alive_bonus: 0.02
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  gain_smooth_weight: 0.01
  torque_smooth_weight: 0.001
  terminal_safety_penalty: -25.0
  terminal_quality_weight: 200.0

training:
  policy: "MlpPolicy"
  net_arch: [128, 128]
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  total_timesteps: 2000000
  n_envs: 1
  device: "cpu"
  seed: 0
