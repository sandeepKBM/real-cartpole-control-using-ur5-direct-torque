# A/B VARIANT, 2026-08-05: config/ur5e_mujoco_torque_osc_tuned_wrist_orient_fixed.yaml
# (unmodified) with controller.posture_inertia_scaling: true and NOTHING else changed.
#
# Mechanism adapted from ian-chuang/homestri-ur5e-rl's JointPositionController
# (tau = M(q) @ (kp*e + kd*(-qd))). With task_space_inertia_shaping on, this repo's
# TASK gains are acceleration gains but its POSTURE gains were still torque gains --
# so a given posture error commanded the same torque in shoulder_lift as in wrist_3.
# Multiplying the posture PD by M(q) makes both terms acceleration commands.
#
# Hypothesis under test: the -45deg/directional posture-authority asymmetry documented
# in AGENTS.md section 3 is partly an inertia-weighting artifact. NOT yet validated --
# this file exists to be A/B'd against its base, and must not be trusted until it is.
# NOTE: kp_posture/kd_posture below are UNCHANGED from the base config, so their
# effective units change when this flag is on; a retune may be required for a fair
# comparison and its absence is a known confound in any first result.
# wrist_orientation_task variant of config/ur5e_mujoco_torque_osc_tuned.yaml,
# WITH the promoted singular_scale fix applied.
# NEVER edit ur5e_mujoco_torque_osc_tuned_wrist_orient.yaml itself -- this is a
# new, additive named config per this project's "preserve old configs" rule.
#
# Change from config/ur5e_mujoco_torque_osc_tuned_wrist_orient.yaml: ONLY
# `controller.jacobian_singular_cond_max: 1.0e18` added (was unset, i.e. the
# class default 1.0e5, singular_scale enabled). Nothing else differs -- same
# wrist_orientation_task gains, same kp_rot_wrist/kd_rot_wrist, same base
# gains. This is functionally identical to
# config/ur5e_mujoco_torque_osc_tuned_wrist_orient_no_singular_scale.yaml
# (added 2026-07-30, see docs/status/disable_singular_scale_wrist_orient_validation_2026-07-30.md
# for the freeze-confirmation + 304-run rigor sweep that validated this exact
# change with zero regressions) -- this config exists under a second name
# because docs/status/nullspace_envelope_search_2026-08-01.md (this task) was
# asked to produce this exact filename as its Phase 1 candidate. Prefer
# reading that earlier validation doc for the singular_scale-freeze mechanism
# itself; this file's own job is testing whether the freeze fix, stacked with
# wrist_orientation_task, also resolves the two *separate*, still-open
# failures documented in AGENTS.md sec 3 ("The ceiling is directional" and
# "-45 degree base-rotation Y-drift coupling") -- neither of which the
# 2026-07-30 validation targeted (it only ran the standard alpha grid with
# positive dx).
#
# Why the fix (see config/ur5e_mujoco_torque_osc_tuned.yaml's own header for
# the full mechanism): the transport start pose sits at an exact wrist
# singularity (cond(J) ~1e17). The class-default jacobian_singular_cond_max
# (1e5) collapses singular_scale to ~4e-13 there, freezing essentially all
# task torque (including well-conditioned axes like X) for roughly the first
# half of a move, until floating-point noise perturbs wrist_2 off exactly
# zero. Raising the threshold to 1e18 disables this global gate for any
# physically realizable Jacobian; lambda_regularization (already 0.1 here)
# already provides a healthy, finite wrench at the singularity on its own.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  # Canonical active-origin transport pose for residual-torque transport tuning.
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
    kp_rot_wrist: 0.0
    kd_rot_wrist: 10.0
  wrist_orientation_task: true
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  posture_inertia_scaling: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
