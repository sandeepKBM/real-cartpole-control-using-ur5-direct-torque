# Default tuned operational-space (P3) config. Promoted 2026-07-30 from what was
# config/ur5e_mujoco_torque_osc_tuned_no_singular_scale.yaml -- jacobian_singular_cond_max
# raised from the class default (1.0e5) to 1.0e18, which disables the global cond(J)-based
# singular_scale term in controller_core/x_axis_cartesian_impedance.py for any physically
# realizable Jacobian (double-precision condition numbers don't reach 1e18 in practice).
# The PREVIOUS default (singular_scale enabled, 1.0e5) is preserved unmodified at
# config/ur5e_mujoco_torque_osc_tuned_singular_scale_enabled.yaml.
#
# Why: singular_scale is a GLOBAL scalar (jacobian_singular_cond_max / cond(J)) that
# multiplies the ENTIRE 6-DOF wrench whenever cond(J) exceeds the threshold -- including
# well-conditioned axes. The transport start pose [0,-pi/2,0,-pi/2,0,0] is an exact wrist
# singularity (measured cond(J)=2.49e17), so with the old 1e5 threshold, singular_scale
# collapses to ~4e-13 and nulls essentially all task authority, including the X-translation
# direction (a well-conditioned singular value, sigma=2.16 at this pose). Measured effect
# with the old default: the end-effector does not move in X at all for roughly the first
# half of a 1.5s move (tau stays ~1e-13-1e-4 Nm until t=0.784s), only escaping once wrist_2
# drifts off exactly zero from gravity-comp/integration numerical residuals and cond(J)
# finally drops below 1e5 -- i.e. the controller relied on floating-point noise to break a
# marginal equilibrium, then had to complete the whole move in the remaining time, producing
# a real (not sensor-noise, not estimator-artifact) TCP acceleration spike 53x the nominal
# min-jerk profile's theoretical peak (2.72 vs 0.05 m/s^2 on a gentle dx=0.02m/1.5s move) --
# this was the real root cause behind most of the 2026-07-30 real-hardware TCP-accel guard
# trips investigated in docs/status/safety_envelope_backtest_2026-07-30.md, not sensor noise.
#
# This term is also redundant with, and actively defeats, task_space_inertia_shaping's
# eps-regularized Lambda (lambda_regularization: 0.1, already in this config), which alone
# already produces a finite, healthy X force at this pose (measured Lambda[0,0]=2.54) --
# singular_scale then threw that away.
#
# 2026-07-30 validation (docs/status/disable_global_singular_scale_validation_2026-07-30.md):
# with this fix, tau_applied is non-zero from t=0.028s (freeze gone), and the raw
# CartesianMoveMonitor accel-estimate peak drops to 1.14x the theoretical kinematic peak
# (vs 53x before). Full 4-category rigor sweep (canonical grid, long holds, large
# displacements, torque-scale robustness) at height_alpha in {0.1, 0.2, 0.3, 0.5}, 304 runs:
# 152/152 pass with this config vs 140/152 with the old default -- zero regressions, +12
# passes recovered, every prior failure a small-displacement canonical-grid case where the
# freeze ate too much of a 1.0s move window. One shared failure (alpha=0.5,
# torque_scale=0.1) is identical in both configs -- a real torque-budget limit, unrelated to
# singular_scale. An earlier, informal claim of this validation (referenced in a prior
# commit message) was never backed by a durable artifact; this is the first reproducible
# evidence.
#
# NOT YET applied to config/ur5e_mujoco_torque_osc_tuned_wrist_orient.yaml (the most
# recently developed, actively-used config for the wrist_orientation_task fix) -- it still
# has the class default (1.0e5, singular_scale enabled) and likely has the same freeze bug,
# unvalidated as of this promotion. Flagged, not silently fixed -- needs its own validation
# pass before changing, since it was independently tuned/validated with singular_scale on.
#
# Gain-override string for tools/ur5e_move_hold_transport.py (BASELINE_GAINS
# still overrides config gains for that driver -- same override, unrelated to this change):
#   --gain-overrides-json '{"kp_x": 400.0, "kd_x": 40.0, "kp_rot": 0.0, "kd_rot": 10.0, "kp_posture": 25.0, "kd_posture": 6.0, "kd_joint": 4.0}'
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  # Canonical active-origin transport pose for residual-torque transport tuning.
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
