# Tuned operational-space (P3) config — gain retune of config/ur5e_mujoco_torque_osc.yaml.
# Tuned 2026-07-03 (osc_gain_retune rounds 1-3, move-hold grid dx 0.01-0.04 x hold 1/2s,
# move 1.0s, scale 1.0, seed 0): 8/8 valid_move_and_hold, 0 safety-guard trips,
# worst orientation error 0.173 rad, worst hold x error 0.3 mm, max |qd| 0.18 rad/s,
# zero torque saturation. Untuned OSC scored 1/8 valid with 2 guard trips on the same grid.
#
# Under task_space_inertia_shaping the gains are task-ACCELERATION gains (wrench = Lambda @ PD),
# not stiffnesses — do not copy them into non-OSC configs.
# Key mechanism (why these values): the transport start pose [0, -pi/2, 0, -pi/2, 0, 0] is at
# the UR wrist singularity (wrist_2 = 0), so orientation drifts along a direction the task
# Jacobian cannot actuate. The fixes are joint-space: kp/kd_posture 25/6 anchors the arm
# through the nullspace projector (which passes posture exactly in task-singular directions),
# kd_joint 4.0 damps the singular-direction coasting, lambda_regularization 0.1 lets enough
# posture through near the singularity, and kp_x 400 gives the task authority to out-pull the
# anchor (fixes small-dx settling lag).
#
# Validated envelope: move 1.0s, dx 0.01-0.04, holds <= 2s (8/8 valid). Known limitation:
# holds >= 4s still drift in the singular direction (guard trip ~3.5-4.5s) because q_rest
# stays the pre-move pose, so anchor-vs-task forces pump the self-motion drift; kd_joint 8.0
# passes 4s holds at dx <= 0.05 but makes 1cm moves settle ~1s late. The structural fix is
# posture re-anchoring at hold start (flag-gated controller change, tracked separately).
#
# NOTE: tools/ur5e_move_hold_transport.py overrides config gains with its BASELINE_GAINS;
# to evaluate THIS gain set through that driver pass:
#   --gain-overrides-json '{"kp_x": 400.0, "kd_x": 40.0, "kp_posture": 25.0, "kd_posture": 6.0, "kd_joint": 4.0}'
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  # Canonical active-origin transport pose for residual-torque transport tuning.
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 30.0
    kd_rot: 8.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  nullspace_posture: true
  lambda_regularization: 0.1
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
