# config/ur5e_mujoco_torque_osc_tuned_split_base_wrist.yaml (tonight's best real-hardware-
# validated config, see that file's own header) with `acceleration_feedforward: true`
# additionally added. Everything else in this file is byte-identical to that file.
#
# Why this exists (added 2026-08-01, docs/status/acceleration_feedforward_2026-08-01.md):
# controller_core/x_axis_cartesian_impedance.py's X-axis torque law was pure PD on
# position+velocity error, Fx = kp_x*x_err + kd_x*(x_vel_des - vx) -- always reacting to
# tracking error that has already appeared, never anticipating the commanded trajectory.
# Discussed directly with the user the same night real hardware traces showed tracking lag
# and per-cycle jitter. `accel_duration_scurve`/`accel_duration_triangular` (see
# simulation/ur5e_mujoco_torque.py::x_profile_target) already compute a reference
# acceleration analytically; `acceleration_feedforward` (see that flag's own docstring in
# controller_core/x_axis_cartesian_impedance.py) adds a mass-weighted feedforward term built
# from that reference onto the task wrench, using the same task-space inertia (Lambda) this
# config already builds for `task_space_inertia_shaping`.
#
# Sim-only; not yet real-hardware validated -- see the status doc for the sim comparison
# this config drove (does feedforward measurably reduce tracking lag/jitter on
# accel_duration_scurve at the height_alpha=0.5 zero-degree transport pose, reported
# honestly either way) and for why. Do NOT treat this as a real-hardware-ready config
# without that separate validation step, matching every other sim-only config in this repo.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "impedance"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
    kp_rot_wrist: 0.0
    kd_rot_wrist: 10.0
  wrist_orientation_task: true
  task_space_inertia_shaping: true
  posture_reanchor_on_settle: true
  nullspace_posture: true
  lambda_regularization: 0.1
  jacobian_singular_cond_max: 1.0e18
  split_base_wrist_task: true
  acceleration_feedforward: true
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  friction_feedforward: true
  friction_ff_qd_deadband: 0.05
  friction_ff_coulomb_nm:
    shoulder_pan_joint: 5.0
    shoulder_lift_joint: 5.0
    elbow_joint: 5.0
    wrist_1_joint: 1.0
    wrist_2_joint: 1.0
    wrist_3_joint: 1.0
  friction_ff_viscous:
    shoulder_pan_joint: 0.4
    shoulder_lift_joint: 0.4
    elbow_joint: 0.4
    wrist_1_joint: 0.15
    wrist_2_joint: 0.15
    wrist_3_joint: 0.15
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
