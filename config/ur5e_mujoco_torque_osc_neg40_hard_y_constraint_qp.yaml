# HARD-Y-CONSTRAINT QP CONFIG (2026-08-03) -- first config to use
# controller_core/hard_constraint_qp.py's HardYConstraintQPController.
#
# Use with --controller-kind hard_constraint_qp and:
#   --start-q-rad -0.6981317007977318 -0.8353981633974483 -1.2 -0.9853981633974482 0.2 0.0
#
# Why this exists: every fix tried earlier this session for the -45/-40deg
# Y-drift problem (kp_y/kd_y gain sweep, y_integral_action, y_coupling_
# feedforward, the reduced-task impedance controller, hard-locking
# shoulder_pan) was still fundamentally a SOFT, weighted objective competing
# with X-tracking inside a summed PD wrench -- none of them could actually
# GUARANTEE Y stayed within tolerance if X-tracking demanded enough torque,
# which is why three independent Y-fixes all hit the identical wall.
#
# This config uses controller_core/hard_constraint_qp.py instead: a real
# linear inequality constraint on Y-axis acceleration (a tight band around
# the same kp_y/kd_y-computed target), solved via
# controller_core/constrained_box_qp.py's dual-ascent method (reuses the
# already-tested box_qp.solve_box_qp as the inner solve, root-finds a
# Lagrange multiplier so the constraint either lands exactly on its
# boundary or is reported explicitly infeasible -- never silently
# violated within the box constraints available).
#
# NOTE: this controller does NOT support reduced_task_dims / task_lock_* /
# wrench_lambda_adaptive_regularization / y_coupling_feedforward -- those
# are all XAxisCartesianImpedanceController-only mechanisms with a
# completely separate implementation. This is a fresh, simpler task
# structure (full 6D soft-weighted task + Y as an added hard constraint),
# not a drop-in upgrade of the reduced-task impedance config.
#
# Timing (measured 2026-08-03, isolated solver call, single Y constraint,
# realistic 6-DOF problem size): mean 0.17ms, p99 0.19ms -- ~8.5% of the
# 500Hz/2.0ms cycle budget. Real end-to-end compute() timing not yet
# measured through the full sim rollout -- see session notes for the
# planned follow-up measurement before trusting this on real hardware.
#
# NOT yet real-hardware validated. NOT yet compared against the reduced-
# task impedance controller's best sim result at this pose.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  joint_order:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  actuator_order:
    - shoulder_pan_torque
    - shoulder_lift_torque
    - elbow_torque
    - wrist_1_torque
    - wrist_2_torque
    - wrist_3_torque
  site_name: "attachment_site"
  home_qpos: [0.0, -1.5707963267948966, 0.0, -1.5707963267948966, 0.0, 0.0]
  use_home_qpos_as_start: true
  gravity_mode: "gravity_comp"
  gravity_source: "pinocchio"
  coriolis_feedforward: true
  default_controller: "torque_qp"
  output_dir: "outputs/ur5e_mujoco_torque_transport"

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  jacobian_singular_cond_max: 1.0e18
  torque_headroom: 0.9
  qp_posture_regularization: 0.35
  qp_enforce_velocity_bounds: true
  hard_y_constraint: true
  hard_y_tolerance_mps2: 0.05
  dual_sweeps: 4
  dual_root_iters: 10
  safety:
    max_joint_velocity_radps: 2.5
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.05
    max_orientation_error_rad: 0.25

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  torque_smooth_weight: 0.001
