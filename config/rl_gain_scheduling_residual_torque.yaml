# Residual-torque variant of config/rl_gain_scheduling_alpha05_bidirectional.yaml
# (preserved unmodified). Second of three RL architecture increments planned
# after that config's training run succeeded (AGENTS.md sec 3, 2026-07-27/28
# finding; plan at /common/home/ss5772/.claude/plans/sharded-hatching-globe.md).
#
# Instead of the policy outputting all 11 Cartesian-impedance gains every step
# ("gains" mode, the original design), this config fixes the gains for the
# whole episode (the validated config/ur5e_mujoco_torque_osc_tuned.yaml
# values) and has the policy output a small signed 6-dim joint-torque
# correction added on top of the controller's own output -- mirroring how
# tau_coriolis/tau_gravity already get added externally elsewhere in this
# codebase. This is a narrower, more targeted action space than re-deriving
# 11 gains from scratch every step, which may make the alpha=0.5 directional
# fix easier to learn.
#
# Run a short smoke run (small n_envs/total_timesteps) before committing to
# the full 3M-step run below -- this config has not yet been training-tested.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  gravity_source: "pinocchio"
  coriolis_feedforward: true

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  # Construction-time seed only -- immediately overwritten in reset() by
  # env.residual_torque.fixed_gains below (kept identical to it so the
  # controller's pre-reset() state, if ever inspected, isn't misleading).
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  nullspace_posture: true
  lambda_regularization: 0.1
  posture_reanchor_on_settle: true
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.35

env:
  control_decimation_steps: 1
  height_alpha_range: [0.5, 0.5]
  target_x_delta_range_m: [-0.20, 0.20]
  move_duration_s: 1.0
  hold_duration_s: 2.0
  max_episode_seconds: 3.0
  record_lightweight_trace: true
  full_trace_logging: false
  # gain_bounds is unused in residual_torque mode (action_space is 6-dim, not
  # 11-dim) but the env still requires every GAIN_FIELDS entry present at
  # construction time -- kept identical to the gains-mode config's bounds so
  # the two configs stay directly comparable if action_mode is ever flipped
  # back for an ablation.
  gain_bounds:
    kp_x: [0.0, 800.0]
    kd_x: [0.0, 80.0]
    kp_y: [0.0, 160.0]
    kd_y: [0.0, 30.0]
    kp_z: [0.0, 240.0]
    kd_z: [0.0, 40.0]
    kp_rot: [0.0, 30.0]
    kd_rot: [0.0, 40.0]
    kp_posture: [0.0, 100.0]
    kd_posture: [0.0, 24.0]
    kd_joint: [0.0, 16.0]
  action_mode: "residual_torque"
  residual_torque:
    # Seeded from config/ur5e_mujoco_torque_osc_tuned.yaml's validated
    # values -- the same fixed law the ~250-run OSC validation campaign
    # tested, held static for the whole episode; the policy only adds a
    # small torque correction on top of it.
    fixed_gains:
      kp_x: 400.0
      kd_x: 40.0
      kp_y: 80.0
      kd_y: 15.0
      kp_z: 120.0
      kd_z: 20.0
      kp_rot: 0.0
      kd_rot: 10.0
      kp_posture: 25.0
      kd_posture: 6.0
      kd_joint: 4.0
    # Deliberately small relative to the joint torque_limits above (150 Nm
    # shoulder/elbow, 28 Nm wrist) -- a correction, not a second controller.
    # Wrist joints get a tighter bound since they're both lower-torque and
    # where the diagnosed directional asymmetry actually lives (nullspace
    # posture projector, wrist_2 sign). No implicit default in the env code;
    # this value must be a deliberate choice, tightened/loosened only after
    # real training evidence.
    max_nm: [5.0, 5.0, 5.0, 2.0, 2.0, 2.0]

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  gain_smooth_weight: 0.01
  torque_smooth_weight: 0.001
  terminal_safety_penalty: -25.0
  terminal_quality_weight: 50.0
  progress_weight: 50.0
  move_phase_disturbance_scale: 0.3

training:
  policy: "MlpPolicy"
  net_arch: [128, 128]
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  total_timesteps: 3000000
  n_envs: 57
  device: "cpu"
  seed: 0
