# Scoped variant of config/rl_gain_scheduling.yaml (preserved unmodified) for the
# height_alpha=0.5 directional-asymmetry fix (see AGENTS.md sec 3, 2026-07-27/28
# finding). The fixed-gain OSC controller cannot fix this: a kp_posture/kd_posture/
# kd_joint sweep at the exact failing case (alpha=0.5, dx=-0.20m) barely moved the
# outcome, because the root cause is that the nullspace-posture projector's own
# magnitude is asymmetric with wrist_2 sign at this pose -- a fixed-gain PD law
# can't be direction-aware, but a state-conditioned policy can be. This config
# trains ONLY at this height (not the general height-conditioned problem the
# default config targets) so the policy's whole capacity goes toward the specific
# case that needs fixing.
mujoco:
  scene_xml: "assets/ur5e_torque/scene.xml"
  gravity_source: "pinocchio"
  coriolis_feedforward: true

controller:
  torque_limits_mode: "initial"
  torque_limits_initial:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  torque_limits_after_stable:
    shoulder_pan_joint: 150.0
    shoulder_lift_joint: 150.0
    elbow_joint: 150.0
    wrist_1_joint: 28.0
    wrist_2_joint: 28.0
    wrist_3_joint: 28.0
  gains:
    kp_x: 400.0
    kd_x: 40.0
    kp_y: 80.0
    kd_y: 15.0
    kp_z: 120.0
    kd_z: 20.0
    kp_rot: 0.0
    kd_rot: 10.0
    kp_posture: 25.0
    kd_posture: 6.0
    kd_joint: 4.0
  task_space_inertia_shaping: true
  nullspace_posture: true
  lambda_regularization: 0.1
  posture_reanchor_on_settle: true
  torque_headroom: 0.9
  task_resample_factor: 0.5
  task_resample_min_scale: 0.0001
  task_resample_max_iters: 14
  safety:
    max_joint_velocity_radps: 3.0
    max_abs_y_drift_m: 0.03
    max_abs_z_drift_m: 0.03
    max_abs_orthogonal_drift_m: 0.03
    max_orientation_error_rad: 0.35

env:
  control_decimation_steps: 1
  # Fixed at the exact failing height -- not a range. The general
  # height-conditioned problem is a different, harder task; this one is
  # scoped tightly to what actually needs fixing.
  height_alpha_range: [0.5, 0.5]
  # Bidirectional (unchanged from the default config's range) -- the whole
  # point is learning a policy that handles BOTH +0.20m (already easy) and
  # -0.20m (currently fails at half the wrist_2 excursion +0.20m tolerates)
  # from the same height, since a fixed-gain law can't do this asymmetrically.
  target_x_delta_range_m: [-0.20, 0.20]
  move_duration_s: 1.0
  hold_duration_s: 2.0
  max_episode_seconds: 3.0
  record_lightweight_trace: true
  full_trace_logging: false
  gain_bounds:
    kp_x: [0.0, 800.0]
    kd_x: [0.0, 80.0]
    kp_y: [0.0, 160.0]
    kd_y: [0.0, 30.0]
    kp_z: [0.0, 240.0]
    kd_z: [0.0, 40.0]
    kp_rot: [0.0, 30.0]
    kd_rot: [0.0, 40.0]
    kp_posture: [0.0, 100.0]
    kd_posture: [0.0, 24.0]
    kd_joint: [0.0, 16.0]

reward:
  alive_bonus: 0.5
  x_hold_weight: 5.0
  y_hold_weight: 5.0
  z_hold_weight: 10.0
  orientation_weight: 5.0
  gain_smooth_weight: 0.01
  torque_smooth_weight: 0.001
  terminal_safety_penalty: -25.0
  terminal_quality_weight: 50.0
  # New this run (2026-07-28 fix; see AGENTS.md/commit message for the
  # root-cause diagnosis this addresses):
  #   progress_weight: potential-based shaping, reward |x_error| reduction
  #   step-over-step. Magnitude chosen to be comparable to x_hold_weight's
  #   own penalty scale given typical per-step error deltas (~1e-4 m), not
  #   arbitrary: 50 * 1e-4 ~= 5e-3, matching x_hold_weight(5.0) * typical
  #   |x_error| (~1e-3) in order of magnitude.
  #   move_phase_disturbance_scale: relax (not remove) the y/z/orientation
  #   penalties specifically during the move phase, since some transient
  #   disturbance while still learning mid-move gains is expected and
  #   shouldn't be penalized as if it were a hold-phase failure. Terminal
  #   safety/quality signals are UNCHANGED -- this only reshapes the dense
  #   per-step gradient, not what counts as success.
  progress_weight: 50.0
  move_phase_disturbance_scale: 0.3

training:
  policy: "MlpPolicy"
  net_arch: [128, 128]
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  # ent_coef unset before this fix (SB3 defaults to 0.0 -- zero exploration
  # incentive, the diagnosed cause of the prior "never move" collapse).
  ent_coef: 0.01
  total_timesteps: 3000000
  # westeros has 72 CPU cores; use ~80% per explicit instruction, leaving
  # headroom for other processes on this shared machine.
  n_envs: 57
  device: "cpu"
  seed: 0
